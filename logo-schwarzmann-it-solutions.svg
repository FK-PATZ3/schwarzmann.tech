<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-labelledby="title desc">
  <title id="title">Schwarzmann IT-Solutions Logo</title>
  <desc id="desc">Netzwerk-inspiriertes Signet in petrolblauer Kachel mit Wortmarke</desc>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13718d"/>
      <stop offset="100%" stop-color="#0c5369"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#13718d" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="96" height="96" rx="28" fill="url(#g)" filter="url(#shadow)"/>

  <g fill="none" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="48" cy="48" r="10"/>
    <circle cx="84" cy="66" r="10"/>
    <circle cx="54" cy="94" r="10"/>
    <path d="M57 53 75 62"/>
    <path d="M63 87 75 75"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="146" y="68" font-size="38" font-weight="800" fill="#16232d" letter-spacing="-0.8">Schwarzmann</text>
    <text x="402" y="68" font-size="38" font-weight="500" fill="#13718d" letter-spacing="-0.8">IT-Solutions</text>
    <text x="146" y="100" font-size="14" font-weight="800" fill="#6a7a86" letter-spacing="2.4">ENTERPRISE KNOW-HOW · PERSÖNLICHER SERVICE</text>
  </g>
</svg>
